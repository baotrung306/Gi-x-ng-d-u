<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xăng VN">
<meta name="description" content="Tính tiền đổ xăng - Giá cập nhật tự động">
<title>⛽ Tính Tiền Xăng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght=400;600;700;800;900&family=Roboto+Mono:wght=500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #070d1a;
    --surface: #0f1829;
    --surface2: #162035;
    --border: rgba(255,255,255,0.07);
    --text: #f0f4ff;
    --muted: #4a5568;
    --accent: #f97316;
    --accent2: #fb923c;
    --green: #22c55e;
    --blue: #3b82f6;
    --indigo: #6366f1;
    --yellow: #eab308;
    --red: #ef4444;
    --purple: #a855f7;
    --slate: #94a3b8;
    --font: 'Nunito', sans-serif;
    --mono: 'Roboto Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow-x: hidden;
  }

  /* BG glow */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(99,102,241,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 0 0 40px;
  }

  /* ─── HEADER ─── */
  .header {
    padding: 52px 24px 28px;
    text-align: center;
  }
  .header-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 20px rgba(249,115,22,0.6));
    animation: floatIcon 3s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .header h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f97316, #fb923c, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
    font-weight: 600;
  }

  /* ─── UPDATE BAR ─── */
  .update-bar {
    margin: 0 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .update-status {
    font-size: 12px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
  }
  .update-status.ok { color: var(--green); }
  .update-status.warn
