<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xăng VN">
<meta name="description" content="Tính tiền đổ xăng - Giá cập nhật tự động">
<title>⛽ Tính Tiền Xăng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #070d1a;
    --surface: #0f1829;
    --surface2: #162035;
    --border: rgba(255,255,255,0.07);
    --text: #f0f4ff;
    --muted: #4a5568;
    --accent: #f97316;
    --accent2: #fb923c;
    --green: #22c55e;
    --blue: #3b82f6;
    --indigo: #6366f1;
    --yellow: #eab308;
    --red: #ef4444;
    --purple: #a855f7;
    --slate: #94a3b8;
    --font: 'Nunito', sans-serif;
    --mono: 'Roboto Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow-x: hidden;
  }

  /* BG glow */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(99,102,241,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 0 0 40px;
  }

  /* ─── HEADER ─── */
  .header {
    padding: 52px 24px 28px;
    text-align: center;
  }
  .header-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 20px rgba(249,115,22,0.6));
    animation: floatIcon 3s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .header h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f97316, #fb923c, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
    font-weight: 600;
  }

  /* ─── UPDATE BAR ─── */
  .update-bar {
    margin: 0 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .update-status {
    font-size: 12px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
  }
  .update-status.ok { color: var(--green); }
  .update-status.warn { color: var(--yellow); }
  .update-status.loading { color: var(--slate); }
  .btn-refresh {
    background: rgba(249,115,22,0.12);
    border: 1px solid rgba(249,115,22,0.25);
    color: var(--accent);
    border-radius: 10px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 800;
    font-family: var(--font);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-refresh:active { transform: scale(0.95); }
  .btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── TABS ─── */
  .tabs {
    display: flex;
    margin: 0 16px 20px;
    background: var(--surface);
    border-radius: 14px;
    padding: 4px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s;
    background: transparent;
    color: var(--muted);
  }
  .tab.active {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: white;
    box-shadow: 0 4px 16px rgba(249,115,22,0.4);
  }

  /* ─── SECTION ─── */
  .section { padding: 0 16px; margin-bottom: 20px; }
  .section-title {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* ─── FUEL GRID ─── */
  .fuel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .fuel-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .fuel-card:active { transform: scale(0.97); }
  .fuel-card.selected {
    border-color: var(--fc, var(--accent));
    background: var(--fc-bg, rgba(249,115,22,0.1));
    box-shadow: 0 0 0 1px var(--fc, var(--accent)) inset, 0 4px 20px rgba(0,0,0,0.3);
  }
  .fuel-icon { font-size: 20px; margin-bottom: 6px; display: block; }
  .fuel-name { font-size: 11px; font-weight: 800; color: #94a3b8; line-height: 1.3; margin-bottom: 4px; }
  .fuel-card.selected .fuel-name { color: var(--text); }
  .fuel-price {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .fuel-card.selected .fuel-price { color: var(--fc, var(--accent)); }

  /* ─── INPUT AREA ─── */
  .input-wrap {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 18px 20px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(249,115,22,0.1);
  }
  .input-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .liter-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    width: 100%;
    min-width: 0;
  }
  .liter-input::placeholder { color: var(--surface2); }
  .liter-unit {
    font-size: 18px;
    font-weight: 900;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* numpad */
  .numpad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .np-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 6px;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    text-align: center;
  }
  .np-btn:active { transform: scale(0.92); background: var(--accent); color: white; }
  .np-btn.del { color: #ef4444; font-size: 18px; }
  .np-btn.decimal { color: var(--slate); }

  /* ─── MODE TOGGLE ─── */
  .mode-toggle {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 14px;
    gap: 3px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px 6px;
    border: none;
    border-radius: 9px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    line-height: 1.3;
  }
  .mode-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ─── CALCULATE BTN ─── */
  .btn-calc {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    border: none;
    border-radius: 18px;
    font-family: var(--font);
    font-size: 17px;
    font-weight: 900;
    color: white;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 32px rgba(249,115,22,0.4);
    transition: all 0.2s;
  }
  .btn-calc:active { transform: scale(0.98); box-shadow: 0 4px 16px rgba(249,115,22,0.3); }
  .btn-calc:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }

  /* ─── RESULT ─── */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    animation: resultPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes resultPop {
    from { transform: scale(0.85) translateY(10px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  .result-desc { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .result-amount {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 700;
    background: linear-gradient(135deg, #f97316, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .result-unit-price { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 8px; }
  .result-tags {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .result-tag {
    background: rgba(249,115,22,0.1);
    border: 1px solid rgba(249,115
